services:
  - type: web
    name: admin-panel-frontend
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PROJECT_REF
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SEVERAIN_AI_SUPABASE_URL
        sync: false
      - key: VITE_SEVERAIN_AI_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ASSETS_BASE_URL
        sync: false
      - key: VITE_CADEAU_URL
        sync: false
      - key: VITE_FLASK_TIMETABLE_ADMIN_URL
        sync: false
      - key: VITE_FLASK_TIMETABLE_CLIENT_URL
        sync: false
